<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' data:; media-src 'self' blob: mediastream:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'"
    />
    <title>Cozy — Faces</title>
  </head>
  <body>
    <div id="faces"></div>
    <!--
      No bundle of its own. This window shares a renderer process with the Stage
      (same origin + window.open), so the Stage's Preact runtime renders straight
      into this document and hands it live MediaStreams with no IPC in between.
    -->
    <script>
      window.opener.__cozy.mountFaces(document)
    </script>
  </body>
</html>
