name = "cozy-signal"
main = "worker.ts"
compatibility_date = "2025-06-01"

# Durable Objects with WebSocket hibernation: an idle room costs nothing while
# the sockets stay open, and clients close them ~20s after the peer connection
# is up anyway. Thousands of sessions a day sit inside the free tier.
[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

[observability]
enabled = true

# Rate limiting, in the config rather than a dashboard rule someone has to
# remember. 30 connection attempts a minute per IP: invisible to two people
# opening a room, ruinous to anyone enumerating them. The worker treats this
# binding as optional, so removing it degrades rather than breaks.
[[unsafe.bindings]]
name = "ROOM_LIMIT"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 30, period = 60 }
